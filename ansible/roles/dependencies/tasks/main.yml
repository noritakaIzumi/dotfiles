- name: Ensure required bootstrap packages are installed
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - git
      - wget
      - software-properties-common
      - gpg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install apt dependencies
  become: true
  ansible.builtin.apt:
    name: "{{ apt_packages | reject('match', '^https?://') | list }}"
    state: present
  when: apt_packages | reject('match', '^https?://') | list | length > 0

- name: Ensure downloaded apt package cache exists
  become: true
  ansible.builtin.file:
    path: /var/cache/ansible/apt-packages
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: apt_packages | select('match', '^https?://') | list | length > 0

- name: Download and install apt packages from URLs
  block:
    - name: Download apt packages from URLs
      become: true
      ansible.builtin.get_url:
        url: "{{ item }}"
        dest: "/var/cache/ansible/apt-packages/{{ item | basename }}"
        mode: '0644'
      loop: "{{ apt_packages | select('match', '^https?://') | list }}"
      register: downloaded_apt_packages

    - name: Install downloaded apt packages
      become: true
      ansible.builtin.apt:
        deb: "{{ item.dest }}"
        state: present
      loop: "{{ downloaded_apt_packages.results | default([]) }}"
  always:
    - name: Remove downloaded apt packages
      become: true
      ansible.builtin.file:
        path: "{{ item.dest }}"
        state: absent
      loop: "{{ downloaded_apt_packages.results | default([]) }}"
      when: item.dest is defined

- name: Import asdf tasks
  ansible.builtin.import_tasks: asdf.yml

- name: Import uv tasks
  ansible.builtin.import_tasks: uv.yml

- name: Import act tasks
  ansible.builtin.import_tasks: act.yml

- name: Import Volta tasks
  ansible.builtin.import_tasks: volta.yml

- name: Import wslu tasks
  ansible.builtin.import_tasks: wslu.yml

- name: Autoremove unused apt packages
  become: true
  ansible.builtin.apt:
    autoremove: true

- name: Clean apt cache
  become: true
  ansible.builtin.apt:
    clean: true

- name: Show dependency installation finished
  ansible.builtin.debug:
    msg: "dependency installation finished"
