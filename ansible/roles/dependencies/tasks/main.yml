- name: Ensure required bootstrap packages are installed
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - git
      - wget
      - software-properties-common
      - gpg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install apt dependencies
  become: true
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present

- name: Import asdf tasks
  ansible.builtin.import_tasks: asdf.yml

- name: Import uv tasks
  ansible.builtin.import_tasks: uv.yml

- name: Import act tasks
  ansible.builtin.import_tasks: act.yml

- name: Import Volta tasks
  ansible.builtin.import_tasks: volta.yml

- name: Import wslu tasks
  ansible.builtin.import_tasks: wslu.yml

- name: Autoremove unused apt packages
  become: true
  ansible.builtin.apt:
    autoremove: true

- name: Clean apt cache
  become: true
  ansible.builtin.apt:
    clean: true

- name: Show dependency installation finished
  ansible.builtin.debug:
    msg: "dependency installation finished"
